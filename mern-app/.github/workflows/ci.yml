name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mern-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mern-app/package-lock.json
      - run: npm ci
      - run: npm run lint --workspace server --if-present
      - run: npm test --workspace server --if-present

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mern-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mern-app/package-lock.json
      - run: npm ci
      - run: npm run lint --workspace client --if-present
      - run: npm run build --workspace client --if-present
